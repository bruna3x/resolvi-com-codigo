<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.resumo | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <a class="marca" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Principal">
      <a href="{{ '/' | relative_url }}">Receitas</a>
      <a href="{{ '/sobre/' | relative_url }}">Sobre</a>
    </nav>
  </header>

  <main id="conteudo">
    {{ content }}
  </main>

  <footer class="rodape">
    <p>{{ site.title }}: {{ site.subtitulo | downcase }}. Escrito por {{ site.author }}.</p>
    <p>Os scripts são livres para copiar e adaptar. Teste antes de confiar.</p>
  </footer>
  <script src="{{ '/assets/js/copiar.js' | relative_url }}" defer></script>
</body>
</html>
